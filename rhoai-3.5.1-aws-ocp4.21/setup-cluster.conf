# AWS OCP 4.21+ (validated targets 4.21/4.22) -> RHOAI 3.5 baseline, standalone NooBaa + MLflow.
# Read README.md. Authentication reuses your cluster-admin oc session.
# For Keycloak OIDC, use browser authentication; DO NOT store admin passwords here.
OPENSHIFT_AUTH_MODE=existing      # existing or web (web prompts only when not logged in)
OPENSHIFT_API_URL=''             # optional, e.g. https://api.cluster.example:6443 for web login
OPENSHIFT_EXPECTED_ADMIN_USER='' # optional: fail if oc whoami is a different user
# Operator source/package names and channels are verified at runtime.
OLM_APPROVAL=Automatic
OPERATOR_TIMEOUT=2400
CRD_TIMEOUT=900
READY_TIMEOUT=3600

# Existing control plane is NEVER changed. Only worker MachineSets may grow.
MIN_READY_WORKERS=3
WORKER_MACHINESET_SOURCE_NAME=''    # auto-select non-GPU worker MachineSet
WORKER_WAIT_SECONDS=2700
# Does not change instance type/disk on existing worker MachineSets.

GPU_ENABLED=true
GPU_MACHINESET_SOURCE_NAME=''       # auto-select same-region worker MachineSet
GPU_MACHINESET_NAME=''              # defaults to <source>-gpu
GPU_MACHINESET_REPLICAS=1
GPU_MACHINESET_INSTANCE_TYPE=g6e.2xlarge
GPU_MACHINESET_ROOT_VOLUME_SIZE_GB=1000
GPU_SELECTOR_KEY=gpu.openshift.ai/accelerator
GPU_SELECTOR_VALUE=nvidia
GPU_TAINT_KEY=nvidia.com/gpu
GPU_TAINT_VALUE=present
GPU_TAINT_EFFECT=NoSchedule
GPU_WAIT_SECONDS=3600

# keycloak: require a configured OpenID provider in OAuth/cluster; never change it.
# preserve: retain whatever IdPs are configured, with no OpenID assertion.
# htpasswd: explicitly create/update an HTPasswd provider (requires working admin session).
IDENTITY_PROVIDER_MODE=keycloak
KEYCLOAK_OAUTH_IDP_NAME=''       # optional exact OpenShift OAuth provider name
HTPASSWD_PATH="$SCRIPT_DIR/users.htpasswd"
HTPASSWD_IDP=local-users
HTPASSWD_SECRET=htpasswd-secret
ADMIN_USER=clusteradmin

CERT_MANAGER_ENABLED=true
RHCL_ENABLED=true
RHCL_CHANNEL=stable
RHCL_EXPECTED_CSV_REGEX='^rhcl-operator\.v1\.4\.[2-9][0-9]*$'
LWS_ENABLED=true
JOBSET_ENABLED=true
PIPELINES_ENABLED=true
SERVICEMESH3_ENABLED=true
NFD_ENABLED=true
NVIDIA_ENABLED=true
ODF_ENABLED=true
# auto derives stable-4.<OCP minor> and validates it exists in OperatorHub.
# Explicit channels must match detected OCP minor; no silent downgrade.
ODF_CHANNEL=auto
NOOBAA_ENABLED=true
NOOBAA_STORAGE_CLASS=gp3-csi
# ODF operator manages NooBaa database size and default backingstore.
# Do not deploy a direct NooBaa CR, PV pool or hand-written bucket StorageClass.
MCG_RESOURCE_WAIT_SECONDS=600
MCG_CREDENTIAL_WAIT_SECONDS=240
CNPG_ENABLED=true

RHOAI_CHANNEL=stable-3.5
RHOAI_STARTING_CSV=
RHOAI_EXPECTED_CSV_REGEX='^rhods-operator\.3\.5\.[0-9]+$'
DSCI_NAME=default-dsci
DSC_NAME=default-dsc
# Baseline RHOAI features. MaaS/AI Gateway added by setup-maas.sh.
ENABLE_AIPIPELINES=true
ENABLE_RAY=true
ENABLE_FEAST=true
ENABLE_KSERVE=true
ENABLE_TRUSTYAI=true
ENABLE_MODELREGISTRY=true
ENABLE_WORKBENCHES=true
ENABLE_MLFLOW_OPERATOR=true

# RHOAI 3.5 integrated observability; Red Hat Operators from stable channels.
ENABLE_RHOAI_OBSERVABILITY=true
ENABLE_RHOAI_ALERTING=true
ENABLE_RHOAI_TRACING=true
COO_CHANNEL=stable
OTEL_CHANNEL=stable
TEMPO_CHANNEL=stable
OBS_NAMESPACE=redhat-ods-monitoring
OBS_PROMETHEUS_REPLICAS=1
OBS_METRICS_SIZE=10Gi
OBS_METRICS_RETENTION=15d
OBS_TRACE_SAMPLE_RATIO=0.1
OBS_TRACE_RETENTION=168h
# Refresh Dashboard only when observability is first created or its requested config changes.
OBS_RESTART_DASHBOARD_ON_CHANGE=true
OBS_DASHBOARD_ROLLOUT_TIMEOUT=300

# Show RHOAI 3.5 Technology/Developer Preview dashboard features in demo clusters.
# Does not install all dependent services. MaaS/OGX configuration runs in setup-maas.sh.
ENABLE_DASHBOARD_FEATURE_PREVIEWS=true

# Create actual MLflow server, backing CNPG and S3 OBC (not only enable operator).
MLFLOW_DEPLOY_INSTANCE=true
MLFLOW_NAMESPACE=redhat-ods-applications
MLFLOW_NAME=mlflow
MLFLOW_REPLICAS=2
MLFLOW_DB_NAMESPACE=mlflow-db
MLFLOW_DB_CLUSTER=mlflow
MLFLOW_DB_STORAGE_CLASS=gp3-csi
MLFLOW_DB_STORAGE_SIZE=10Gi
MLFLOW_DB_INSTANCES=2
MLFLOW_OBC_NAME=mlflow-artifacts
MLFLOW_ARTIFACT_PREFIX=artifacts
MLFLOW_S3_REGION=us-east-1
# The MLflow namespace's OpenShift trusted CA must include CNPG's CA.
MLFLOW_TRUST_CNPG_CA=true
