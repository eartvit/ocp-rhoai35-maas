# RHOAI 3.5.1 MaaS overlay. Runs after setup-cluster.sh.
OLM_APPROVAL=Automatic
OPERATOR_TIMEOUT=2400
CRD_TIMEOUT=1200
READY_TIMEOUT=3600
DSCI_NAME=default-dsci
DSC_NAME=default-dsc
RHOAI_OPERATOR_NAMESPACE=redhat-ods-operator
RHOAI_EXPECTED_CSV_REGEX='^rhods-operator\.3\.5\.[0-9]+$'
RHCL_EXPECTED_CSV_REGEX='^rhcl-operator\.v1\.4\.[2-9][0-9]*$'
KUADRANT_NS=kuadrant-system
KUADRANT_NAME=kuadrant
MAAS_NAMESPACE=models-as-a-service
MAAS_INFRA_NAMESPACE=redhat-ai-gateway-infra
MAAS_TENANT_NAME=default-tenant

# CNPG database for MaaS key management.
MAAS_DB_NAMESPACE=maas-db
MAAS_DB_CLUSTER=maas
MAAS_DB_INSTANCES=2
MAAS_DB_STORAGE_CLASS=gp3-csi
MAAS_DB_STORAGE_SIZE=10Gi

# New 3.5 Gateway use one HTTPS listener, not dual listeners on the same host.
GATEWAY_NAME=maas-default-gateway
GATEWAY_NAMESPACE=openshift-ingress
GATEWAY_CLASS=openshift-default
GATEWAY_HOST=''   # if empty: maas.<apps-domain>; override for custom DNS/cert
GATEWAY_TLS_SECRET=''  # auto-detect spec.defaultCertificate.name on IngressController/default
GATEWAY_NAMESPACE_LABEL_PREFIX=maas.opendatahub.io/gateway-access-

# Create hardware profile automatically; ties to setup-cluster.conf labels/taint.
# Default maxima fit g6e.2xlarge (8 vCPU / 64 GiB) with kube-reserved headroom.
# Review the numbers if you change the EC2 instance type.
CREATE_GPU_HARDWARE_PROFILE=true
GPU_HARDWARE_PROFILE_NAME=nvidia-gpu
GPU_HARDWARE_PROFILE_DISPLAY_NAME="NVIDIA GPU (${GPU_MACHINESET_INSTANCE_TYPE})"
# GPU_SELECTOR_KEY, GPU_SELECTOR_VALUE, GPU_TAINT_* and EC2 type are inherited
# from setup-cluster.conf. Do not duplicate them here; they must match.
GPU_PROFILE_CPU_DEFAULT=4
GPU_PROFILE_CPU_MAX=6
GPU_PROFILE_MEMORY_DEFAULT=16Gi
GPU_PROFILE_MEMORY_MAX=48Gi
GPU_PROFILE_GPU_DEFAULT=1
GPU_PROFILE_GPU_MAX=1

# Enabled only when add-on installed. Optional observability dashboard needs
# extra operators / telemetry: default false until MaaS basic path validates.
ENABLE_USER_WORKLOAD_MONITORING=true
ENABLE_GEN_AI_STUDIO=true
ENABLE_MAAS_OBSERVABILITY_DASHBOARD=false
ENABLE_VLLM_DEPLOYMENT_ON_MAAS=true
ENABLE_EXTERNAL_MODELS=false
# Do NOT create sample subscriptions or authorization policies.
