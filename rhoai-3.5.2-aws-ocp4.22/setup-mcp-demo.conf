# Demonstration-specific workflow; not part of generic infrastructure.
DEMO_NAMESPACE=ocp-mcp-demo
DEMO_SERVER=test-ocp-mcp
DEMO_SA=mcp-viewer
DEMO_SECONDARY_NAMESPACE=llm-test
DEMO_CONFIGMAP=openshift-mcp-server-config
DEMO_GATEWAY_NAMESPACE=mcp-system
DEMO_GATEWAY=mcp-gateway
DEMO_GATEWAY_EXTENSION=mcp-gateway
DEMO_ROUTE=test-ocp-mcp-backend
DEMO_REGISTRATION=test-ocp-mcp
DEMO_PREFIX=ocp_
DEMO_KEYCLOAK_CLIENT=mcp-gateway
DEMO_KEYCLOAK_REALM=sso
# Empty: discover OpenShift OAuth OpenID/rhbk issuer.
DEMO_KEYCLOAK_ISSUER=
DEMO_ADMIN_USERNAME=admin
DEMO_USER_USERNAME=user1
DEMO_ADMIN_VSERVER=admin-tools
DEMO_USER_VSERVER=user1-tools
DEMO_WAIT_SECONDS=600
# OpenShift passthrough Route through default router; validated for Playground.
DEMO_CREATE_PLAYGROUND_ROUTE=true
DEMO_PLAYGROUND_ROUTE_NAME=mcp-gateway-playground
DEMO_PLAYGROUND_DISCOVERY_CM=gen-ai-aa-mcp-servers
DEMO_RHOAI_NAMESPACE=redhat-ods-applications
# Creates narrowly scoped namespace read permissions for the common demo SA.
DEMO_ALLOW_NAMESPACE_LIST=true
# Only for lab testing. Security negative tool/call test remains manual.
