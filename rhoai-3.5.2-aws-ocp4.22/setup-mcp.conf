# Generic MCP Gateway infrastructure, RHOAI 3.5.x, OCP >=4.22.
# OCP 4.21 requires an explicit experimental opt-in.
MCP_MIN_OCP_MINOR=22
MCP_ALLOW_UNSUPPORTED_421=false
MCP_NAMESPACE=mcp-system
MCP_OPERATOR_PACKAGE=mcp-gateway
MCP_OPERATOR_CHANNEL=preview
MCP_OPERATOR_SOURCE=redhat-operators
MCP_GATEWAY_NAMESPACE=mcp-system
MCP_GATEWAY_NAME=mcp-gateway
MCP_GATEWAY_CLASS=openshift-default
MCP_EXTENSION_NAME=mcp-gateway
# Empty means mcp.<live ingress domain>.
MCP_HOSTNAME=
# Wildcard listener was required in the validated OCP 4.22 federation layout.
MCP_PUBLIC_LISTENER_HOSTNAME=
# Resolved from live Gateway Service by default.
MCP_PRIVATE_HOST=
# Empty means live IngressController defaultCertificate name.
MCP_INGRESS_TLS_SECRET=
MCP_INTERNAL_HOSTNAME=mcp-internal.mcp.local
MCP_OPERATOR_TIMEOUT=600
MCP_RESOURCE_TIMEOUT=420
ENABLE_MCP_LIFECYCLE=true
MCP_DSC_NAME=default-dsc
MCP_DASHBOARD_CONFIG_NAME=odh-dashboard-config
MCP_DASHBOARD_NAMESPACE=redhat-ods-applications
# Intentional scope: no MCP backend server, registration, virtual server or auth policy.
